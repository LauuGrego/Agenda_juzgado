<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Agenda Juzgado de Paz">
    <title>Agenda Juzgado de Paz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- SECCIÓN: ENCABEZADO -->
    <header class="app-header py-2 px-3 sticky-top border-bottom">
        <div class="container-fluid max-w-1300 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <div class="brand-icon bg-indigo rounded-2 d-flex align-items-center justify-content-center text-white" style="width: 32px; height: 32px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h18"/></svg>
                </div>
                <div>
                    <h1 class="h6 mb-0 fw-semibold text-primary-custom">Agenda - Juzgado</h1>
                </div>
            </div>

            <div class="d-flex align-items-center gap-1">
                <button id="btn-export-backup" class="btn btn-outline-custom btn-sm p-1 px-2 d-flex align-items-center gap-1" title="Exportar Copia de Seguridad">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span class="d-none d-sm-inline small">Exportar</span>
                </button>
                <button id="btn-import-backup" class="btn btn-outline-custom btn-sm p-1 px-2 d-flex align-items-center gap-1" title="Importar Copia de Seguridad">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span class="d-none d-sm-inline small">Importar</span>
                </button>
                <input type="file" id="import-file-input" accept=".json" style="display: none;">

                <button id="theme-toggle" class="btn btn-outline-custom btn-sm p-1 px-2 d-flex align-items-center gap-1" title="Cambiar Tema">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- SECCIÓN: CONTENEDOR PRINCIPAL -->
    <main class="container-fluid max-w-1300 py-2 px-2 px-sm-3">

        <!-- BARRA DE HERRAMIENTAS -->
        <section class="card-toolbar p-2 p-sm-3 mb-3 rounded-3 border">
            
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
                <div class="d-flex align-items-center gap-1">
                    <button id="btn-prev-day" class="btn btn-outline-custom btn-sm p-1 px-2" title="Día Anterior">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <input type="date" id="selected-date" class="form-control form-control-sm font-mono input-custom p-1 text-center" style="width: 130px;">
                    <button id="btn-next-day" class="btn btn-outline-custom btn-sm p-1 px-2" title="Día Siguiente">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                    <button id="btn-today" class="btn btn-outline-custom btn-sm py-1 px-2">Hoy</button>
                </div>
                <div id="current-date-header" class="fw-semibold text-primary-custom small text-capitalize text-truncate" style="max-width: 100%;"></div>
            </div>

            <div class="mb-2">
                <ul class="nav nav-pills nav-fill segmented-controls p-1 rounded-2 border w-100">
                    <li class="nav-item">
                        <button class="nav-link active nav-tab py-1 px-2 small d-flex align-items-center justify-content-center gap-1" data-tab="grid">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                            <span>Grilla</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link nav-tab py-1 px-2 small d-flex align-items-center justify-content-center gap-1" data-tab="list">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                            <span>Activos</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link nav-tab py-1 px-2 small d-flex align-items-center justify-content-center gap-1" data-tab="deactivated">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
                            <span>Desactivados</span>
                        </button>
                    </li>
                </ul>
            </div>

            <div class="row g-2 align-items-center">
                <div class="col">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text input-group-icon px-2">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </span>
                        <input type="text" id="search-input" class="form-control input-custom" placeholder="Buscar">
                    </div>
                </div>
                <div class="col-auto">
                    <button id="btn-new-commitment" class="btn btn-indigo btn-sm d-flex align-items-center gap-1 text-white text-nowrap px-3">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        <span>Nuevo</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- VISTA DE GRILLA -->
        <section id="agenda-grid-container"></section>

    </main>

    <!-- SECCIÓN: MODAL DE FORMULARIO -->
    <div id="commitment-modal" class="modal fade" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-custom rounded-3">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title h6 fw-semibold text-primary-custom" id="modal-title">Nuevo Compromiso</h5>
                    <button type="button" class="btn-close btn-close-custom btn-close-modal" aria-label="Close"></button>
                </div>
                
                <form id="commitment-form">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small text-secondary-custom" for="commitment-title">Título / Motivo *</label>
                            <input type="text" id="commitment-title" class="form-control form-control-sm input-custom" placeholder="Ej: Audiencia Testimonial" required maxlength="120">
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label small text-secondary-custom" for="commitment-date">Fecha *</label>
                                <input type="date" id="commitment-date" class="form-control form-control-sm input-custom" required>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label small text-secondary-custom" for="commitment-priority">Prioridad</label>
                                <select id="commitment-priority" class="form-select form-select-sm input-custom">
                                    <option value="Baja">Baja</option>
                                    <option value="Media" selected>Media</option>
                                    <option value="Alta">Alta</option>
                                    <option value="Urgente">Urgente</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label small text-secondary-custom" for="commitment-start">Hora Inicio (07:00 a 12:30) *</label>
                                <select id="commitment-start" class="form-select form-select-sm input-custom font-mono" required></select>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label small text-secondary-custom" for="commitment-end">Hora Fin (07:30 a 13:00) *</label>
                                <select id="commitment-end" class="form-select form-select-sm input-custom font-mono" required></select>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small text-secondary-custom" for="commitment-notes">Observaciones</label>
                            <textarea id="commitment-notes" class="form-control form-control-sm input-custom" rows="3" placeholder="Detalles u observaciones..."></textarea>
                        </div>
                    </div>

                    <div class="modal-footer border-top">
                        <button type="button" class="btn btn-outline-custom btn-sm btn-close-modal">Cancelar</button>
                        <button type="submit" class="btn btn-indigo btn-sm text-white">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- SECCIÓN: MODAL DE DETALLE -->
    <div id="detail-modal" class="modal fade" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-custom rounded-3">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title h6 fw-semibold text-primary-custom">Detalle de Compromiso</h5>
                    <button type="button" class="btn-close btn-close-custom btn-close-modal" aria-label="Close"></button>
                </div>
                
                <div class="modal-body" id="detail-modal-body"></div>

                <div class="modal-footer border-top">
                    <button type="button" class="btn btn-outline-custom btn-sm btn-close-modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN: MODAL OPCIONES DE IMPORTACIÓN -->
    <div id="import-modal" class="modal fade" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-custom rounded-3">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title h6 fw-semibold text-primary-custom">Importar Copia de Seguridad</h5>
                    <button type="button" class="btn-close btn-close-custom btn-close-modal" aria-label="Close"></button>
                </div>
                
                <div class="modal-body p-3">
                    <p class="small text-secondary-custom mb-3">Se ha cargado un archivo con <strong id="import-count-badge" class="text-light font-mono">0</strong> registro(s). ¿Cómo desea realizar la importación?</p>
                    
                    <div class="d-flex flex-column gap-2">
                        <button id="btn-import-merge" class="btn btn-outline-custom p-2.5 text-start d-flex align-items-start gap-2 rounded-2">
                            <svg class="mt-1 flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-9"/><path d="m8 8 4 4 4-4"/><path d="M3 21h18"/></svg>
                            <div>
                                <strong class="d-block text-light small">Combinar con los datos actuales (Recomendado)</strong>
                                <span class="small text-secondary-custom" style="font-size: 0.78rem;">Conserva tus compromisos actuales y suma los del archivo. Si hay horarios duplicados, te notificaremos para revisarlos.</span>
                            </div>
                        </button>

                        <button id="btn-import-replace" class="btn btn-outline-custom p-2.5 text-start d-flex align-items-start gap-2 rounded-2 border-danger-subtle">
                            <svg class="mt-1 flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="1.5"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            <div>
                                <strong class="d-block text-light small">Reemplazar todo</strong>
                                <span class="small text-secondary-custom" style="font-size: 0.78rem;">Elimina la agenda actual y restaura exactamente lo que hay en el archivo.</span>
                            </div>
                        </button>
                    </div>
                </div>

                <div class="modal-footer border-top">
                    <button type="button" class="btn btn-outline-custom btn-sm btn-close-modal">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN: NOTIFICACIONES -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 2000;"></div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/security.js"></script>
    <script src="js/agendaLogic.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
